# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Stage deployable site
        shell: bash
        run: |
          mkdir -p _site
          cp index.html about.html privacy.html terms.html 404.html guides.html \
             what-is-ocr.html how-to-make-pdf-searchable.html how-to-compress-pdf.html \
             how-to-merge-pdf.html how-to-split-pdf.html pdf-tools-guide.html \
             robots.txt sitemap.xml _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Only the staged site — backups and dev files never ship
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
